
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#171a1d">

    <title>Prison Escape</title>

    <link rel="stylesheet" href="style.css">

    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

    <!-- GAME SCREEN -->
    <div id="game-container"></div>


    <!-- LOADING SCREEN -->
    <div id="loading-screen">

        <h1>PRISON ESCAPE</h1>

        <p>Preparing the environment...</p>

    </div>


    <!-- GAME INTERFACE -->
    <div id="game-ui">


        <!-- TOP BAR -->
        <div id="top-bar">

            <div class="game-title">
                PRISON ESCAPE
            </div>

            <div id="status">
                PROTOTYPE 01
            </div>

        </div>


        <!-- MOBILE CONTROLS -->
        <div id="controls">


            <!-- JOYSTICK -->
            <div id="joystick-area">

                <div id="joystick">

                    <div id="joystick-knob"></div>

                </div>

            </div>


            <!-- ACTION BUTTONS -->
            <div id="action-buttons">

                <button
                    id="run-button"
                    type="button"
                    aria-label="Hold to run"
                >

                    <svg
                        viewBox="0 0 48 48"
                        aria-hidden="true"
                    >

                        <circle
                            cx="31"
                            cy="7"
                            r="5"
                            fill="currentColor"
                        />

                        <path
                            d="M24 15 L33 18 L39 27 L34 30 L29 23 L24 22 L19 30 L12 27 Z"
                            fill="currentColor"
                        />

                        <path
                            d="M23 21 L30 26 L27 34 L20 42 L15 39 L21 31 L17 28 Z"
                            fill="currentColor"
                        />

                        <path
                            d="M30 26 L37 31 L43 38 L39 42 L32 35 L25 32 Z"
                            fill="currentColor"
                        />

                        <path
                            d="M17 27 L11 33 L5 34 L4 29 L12 25 Z"
                            fill="currentColor"
                        />

                    </svg>

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================
         STARTUP ERROR DETECTOR
    ====================================== -->

    <script>

        function showError(title, message) {

            const screen =
                document.getElementById("loading-screen");

            if (!screen) return;

            screen.style.display = "flex";
            screen.innerHTML = "";

            const heading =
                document.createElement("h2");

            heading.style.color = "#ff6565";
            heading.style.fontSize = "21px";
            heading.style.textAlign = "center";
            heading.textContent = title;

            const details =
                document.createElement("p");

            details.style.color = "#ffffff";
            details.style.fontSize = "13px";
            details.style.padding = "20px";
            details.style.textAlign = "center";
            details.style.maxWidth = "90%";
            details.style.wordBreak = "break-word";
            details.textContent = message;

            screen.appendChild(heading);
            screen.appendChild(details);

        }


        // Catch JavaScript errors and resource-loading errors.
        window.addEventListener("error", function(event) {

            const target = event.target;

            if (
                target &&
                target !== window &&
                target.tagName
            ) {

                showError(
                    "FILE LOADING ERROR",
                    "Could not load: " +
                    (target.src || target.href || target.tagName)
                );

                return;
            }

            showError(
                "JAVASCRIPT ERROR",
                (event.message || "Unknown error") +
                " | Line: " +
                (event.lineno || "Unknown") +
                " | File: " +
                (event.filename || "Unknown")
            );

        }, true);


        // Catch failed module imports and rejected promises.
        window.addEventListener(
            "unhandledrejection",
            function(event) {

                showError(
                    "MODULE ERROR",
                    String(event.reason)
                );

            }
        );

    </script>


    <!-- GAME MODULE -->
    <script
        type="module"
        src="game.js?v=4"
        onerror="showError('GAME FILE FAILED TO LOAD', 'The browser could not load game.js or one of its imported modules. Check the file path and network connection.');"
    ></script>


</body>
  </html>
