
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Prison Escape</title>

    <link rel="stylesheet" href="style.css">

    <!-- INTRO SCREEN DESIGN -->
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #171a1c;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 20px;
            text-align: center;

            opacity: 1;
            transition: opacity 0.8s ease;
        }

        .loading-title {
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: clamp(27px, 7vw, 46px);
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.2;
        }

        .loading-text {
            color: #a6a6a9;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 0;
        }

        @media (max-width: 400px) {
            .loading-title {
                font-size: 27px;
                letter-spacing: 3px;
            }

            .loading-text {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <!-- 3D GAME -->
    <div id="game-container"></div>

    <!-- INTRO SCREEN -->
    <div id="loading-screen">

        <div class="loading-title">
            PRISON ESCAPE
        </div>

        <div class="loading-text">
            Preparing the environment...
        </div>

    </div>

    <!-- GAME INTERFACE -->
    <div id="game-ui">

        <div class="mission-label">
            PRISON YARD
        </div>

        <div class="version-label">
            EARLY DEVELOPMENT
        </div>

    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">

        <div id="joystick">
            <div id="joystick-thumb"></div>
        </div>

        <button id="run-button">
            RUN
        </button>

    </div>

    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

    <!-- GAME ENGINE -->
    <script src="game.js"></script>

</body>
          </html>
